name: Structural Engineering Analyzer Tests

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Run Python Tests

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show Python version
        run: |
          python --version
          python -m pip --version

      - name: Show project structure
        run: |
          echo "Project root:"
          pwd
          echo ""
          echo "Files:"
          find . -maxdepth 4 -type f | sort

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Check Python files
        run: |
          python -m compileall calculations tests

      - name: Run tests
        run: |
          python -m pytest tests/test_beams.py -v
